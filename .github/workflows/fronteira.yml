name: Fronteira dos pares mais frageis
# Varreduras paralelas de zeros de ζ em alturas de 10¹³ a 10¹⁸ (FLINT 3 / Arb, método local de Platt), atrás dos pares
# com λ de Csordas–Smith–Varga mais perto de 0⁻: onde a deformação de de Bruijn cria o primeiro quarteto. Cálculo
# finito fora do kernel: não muda OPEN_MATH. Resultado na branch resultados-fronteira.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "computations/fronteira/**"
      - ".github/workflows/fronteira.yml"
permissions:
  contents: write
jobs:
  varre:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 10²⁰ … 10²² saíram: uma chamada do método local de Platt passa de 4 h ali (run 41554617926); o mérito
        # N·ρ³ por hora é maior nas alturas em que se varrem mais zeros (seção 23 do README)
        alvo: ["13 0", "13 1000000000000", "13 2000000000000", "14 0", "14 1000000000000", "14 2000000000000",
               "15 0", "15 1000000000000", "15 2000000000000", "16 0", "16 1000000000000", "16 2000000000000",
               "17 0", "17 1000000000000", "18 0", "18 2000000000000"]
    steps:
      - uses: actions/checkout@v4
      - name: FLINT 3 (com o Arb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libflint-dev
      - name: compila
        run: gcc -O2 -o zeros computations/alturas/zeros.c -lflint -lmpfr -lgmp -lm
      - name: varre
        shell: bash
        run: |
          set -- ${{ matrix.alvo }}
          mkdir -p saida
          python3 computations/fronteira/varre.py ./zeros "saida/varre_$1_$2.json" "$1" "$2" 18000 10000 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varre-${{ strategy.job-index }}
          path: saida/
          if-no-files-found: ignore
  junta:
    needs: varre
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: varre-*
          path: varreduras
      - name: junta
        run: python3 computations/fronteira/agrega.py varreduras resultados 2>&1 | tee junta.log
      - name: resumo como anotação
        if: always()
        run: head -12 resultados/RESUMO.md 2>/dev/null | tr '\n' ' ' | sed -E 's/%/%25/g; s/^/::warning title=fronteira::/' || true
      - name: grava na branch resultados-fronteira
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r resultados/. /tmp/r/ 2>/dev/null || true
          mkdir -p /tmp/r/varreduras && find varreduras -name "*.json" -exec cp {} /tmp/r/varreduras/ \; 2>/dev/null || true
          python3 computations/grava_resultados.py resultados-fronteira /tmp/r --run ${{ github.run_id }} --sha ${{ github.sha }} --titulo "fronteira"
