name: Zeros acima de 3e12
# Zeros de ζ de T_PT = 3 000 175 332 800 (fim de Platt–Trudgian) até g_b + 5000 = 3 000 175 342 471,5, com aritmética
# intervalar (FLINT 3 / Arb).
# Cálculo finito fora do kernel do Lean: não muda OPEN_MATH. O resultado vai para a branch resultados-zeros.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "computations/zeros/**"
      - ".github/workflows/zeros.yml"
permissions:
  contents: write
jobs:
  zeros:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: FLINT 3 (com o Arb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libflint-dev
          dpkg -s libflint-dev | grep -E "^Version"
      - name: compila
        shell: bash
        run: gcc -O2 -o zeros computations/zeros/zeros.c -lflint -lmpfr -lgmp -lm 2>&1 | tee compila.log
      - name: confere o método em altura baixa (zeros conhecidos)
        shell: bash
        run: |
          ./zeros hardy 1 5 128 | tee baixo.json
          ./zeros platt 10000 5 128 | tee platt_baixo.json
          ./zeros hardy 10000 5 128 | tee hardy_baixo.json
      - name: faixa (T_PT, g_b + 5000]
        shell: bash
        run: python3 computations/zeros/janelas.py ./zeros resultados 16200 2>&1 | tee janelas.log
      - name: erros como anotações
        if: failure()
        run: |
          { grep -E -B2 -A6 "Traceback|Error|error" janelas.log compila.log 2>/dev/null | tail -30; } | tr '\n' ' ' | sed -E 's/%/%25/g; s/^/::warning title=zeros-erro::/' || true
          echo
          python3 -c "import json;d=json.load(open('resultados/zeros.json'));print(json.dumps({k:v for k,v in d.items() if k!='blocos'},ensure_ascii=False))" 2>/dev/null | sed -E 's/%/%25/g; s/^/::warning title=zeros-estado::/' || true
      - name: grava na branch resultados-zeros
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r resultados/. /tmp/r/ 2>/dev/null || true
          cp baixo.json platt_baixo.json hardy_baixo.json compila.log janelas.log /tmp/r/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin resultados-zeros:refs/remotes/origin/resultados-zeros || true
          if git rev-parse --verify -q origin/resultados-zeros; then git checkout -q -B resultados-zeros origin/resultados-zeros; else git checkout -q --orphan resultados-zeros; git rm -rq . || true; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/r/. .
          git add -A
          git commit -q -m "zeros acima de 3e12: run ${{ github.run_id }} (${{ github.sha }})" || true
          git push -q origin resultados-zeros
