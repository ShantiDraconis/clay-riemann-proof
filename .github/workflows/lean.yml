name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Se o repositório do enunciado for privado, o token padrão do Actions não consegue
      # cloná-lo: torne o enunciado público ou configure um token com acesso de leitura.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      # os logs do Actions não são legíveis de fora: os erros do build vão para as anotações do job
      - name: erros do build como anotações
        if: failure()
        run: |
          lake build 2>&1 | grep -E -A4 "error" | head -150 | sed -E 's/%/%25/g; s/^/::warning title=lake build::/' || true
