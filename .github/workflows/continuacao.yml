name: Continuacao contigua acima da faixa certificada
# Onde estaria o PRIMEIRO zero fora da reta, se existisse: logo acima da última altura conferida, C0 em
# computations/continuacao/inicio.json (Continuacao.primeiro_fora_acima_continuacao). Quatro faixas contíguas de
# 120 000 unidades de altura (≈ 2 milhões de zeros),
# cada uma com N(T) exato nas pontas (contagem de Turing) e todos os zeros pelo método local de Platt (FLINT 3 / Arb);
# a agregação cola as faixas (N na mesma altura calculado por duas faixas) e lista os pares mais frágeis.
# Cálculo finito fora do kernel: não muda OPEN_MATH. Resultado na branch resultados-continuacao, pasta de_<C0>.
on:
  workflow_dispatch:
    inputs:
      faixas:
        description: 'faixas de 120 000 unidades acima de C0, lista JSON (ex.: [4,5,6,7]); outras faixas que não 0–3 vão para de_<C0>/faixas_<primeira>-<última>/'
        default: '[0,1,2,3]'
  push:
    branches: [main]
    paths:
      - "computations/continuacao/**"
      - ".github/workflows/continuacao.yml"
permissions:
  contents: write
jobs:
  faixa:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(github.event.inputs.faixas || '[0,1,2,3]') }}
    steps:
      - uses: actions/checkout@v4
      - name: FLINT 3 (com o Arb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libflint-dev
      - name: compila
        run: gcc -O2 -o zeros computations/zeros/zeros.c -lflint -lmpfr -lgmp -lm
      - name: faixa ${{ matrix.i }}
        run: python3 computations/continuacao/continua.py ./zeros saida ${{ matrix.i }} 18500 2>&1 | tee saida.log
      - name: estado como anotação
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('saida/faixa${{ matrix.i }}.json'));print(json.dumps({k:d.get(k) for k in ('a','b','N(a)','N(b)','zeros_esperados','certificado_ate','conclusao','parou_em','erro')},ensure_ascii=False))" 2>/dev/null | sed -E 's/%/%25/g; s/^/::warning title=faixa-${{ matrix.i }}::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faixa-${{ matrix.i }}
          path: saida/
          retention-days: 14
  agrega:
    needs: faixa
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: faixas
      - name: numpy e mpmath
        run: python3 -c "import numpy, mpmath" 2>/dev/null || pip install -q numpy mpmath || pip install -q --break-system-packages numpy mpmath
      - name: agrega
        run: python3 computations/continuacao/agrega.py faixas resultado 2>&1 | tee agrega.log
      - name: Gram, Rosser e S(t)
        if: always()
        run: python3 computations/continuacao/gram.py faixas resultado 2>&1 | tee -a agrega.log
      - name: conclusão como anotação
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('resultado/continuacao.json'));print(json.dumps({k:d.get(k) for k in ('conclusao','contiguo','deficits','colagem_ok','onde_examinar')},ensure_ascii=False))" 2>/dev/null | sed -E 's/%/%25/g; s/^/::warning title=continuacao::/' || true
      - name: grava na branch resultados-continuacao
        if: always()
        run: |
          C0=$(python3 -c "import json;print(json.load(open('computations/continuacao/inicio.json'))['C0'])")
          F='${{ github.event.inputs.faixas || '[0,1,2,3]' }}'
          SUB=$(python3 -c "import json,sys;f=json.loads(sys.argv[1]);print('' if f==[0,1,2,3] else '/faixas_%d-%d'%(min(f),max(f)))" "$F")
          D="/tmp/r/de_$C0$SUB"
          mkdir -p "$D" && cp -r resultado/. "$D"/ 2>/dev/null || true
          for d in faixas/faixa-*; do cp "$d"/* "$D"/ 2>/dev/null || true; done
          cp agrega.log "$D"/ 2>/dev/null || true
          python3 computations/grava_resultados.py resultados-continuacao /tmp/r --run ${{ github.run_id }} --sha ${{ github.sha }} --titulo "continuação contígua a partir de $C0"
