name: Alturas onde os pares ficam mais frageis
# Janelas certificadas de zeros de ζ (FLINT 3 / Arb, método local de Platt + contagem de Turing), com os pares de
# Lehmer e a cota de Csordas–Smith–Varga de cada janela. Cálculo finito fora do kernel: não muda OPEN_MATH.
# Três etapas, cada uma grava o que produziu assim que termina (nada se perde num corte de tempo):
#   zeros    — uma tarefa por altura; a lista bruta vai para o disco depois de cada chamada da Arb e para a branch
#              resultados-alturas no fim da tarefa;
#   contagem — N(T_a) e N(T_b) em tarefas separadas, em paralelo, cada uma com o seu orçamento;
#   junta    — confere índice, contagem e bolas; junta com o que já estava na branch (não apaga nenhuma altura).
# 10¹⁴, 10¹⁶ e 10¹⁷ já estão certificadas (run 41588835957); por padrão roda só 10¹⁸.
on:
  workflow_dispatch:
    inputs:
      alturas:
        description: 'expoentes, lista JSON (ex.: ["17","18"])'
        default: '["18"]'
      n:
        description: "zeros por janela"
        default: "20000"
  push:
    branches: [main]
    paths:
      - "computations/alturas/**"
      - ".github/workflows/alturas.yml"
permissions:
  contents: write
jobs:
  zeros:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        e: ${{ fromJSON(github.event.inputs.alturas || '["18"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: FLINT 3 (com o Arb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libflint-dev
      - name: compila
        run: gcc -O2 -o zeros computations/alturas/zeros.c -lflint -lmpfr -lgmp -lm 2>&1 | tee compila.log
      - name: zeros em 10^${{ matrix.e }}
        run: python3 computations/alturas/alturas.py zeros ./zeros resultados 20000 ${{ matrix.e }} ${{ github.event.inputs.n || '20000' }} 2>&1 | tee log-zeros-${{ matrix.e }}.txt
      - name: estado como anotação
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('resultados/zeros_1e${{ matrix.e }}.json'));print(json.dumps({k:v for k,v in d.items() if k!='blocos'},ensure_ascii=False))" 2>/dev/null | sed -E 's/%/%25/g; s/^/::warning title=alturas-zeros-${{ matrix.e }}::/' || true
      - name: guarda
        if: always()
        run: |
          mkdir -p resultados && cp log-zeros-${{ matrix.e }}.txt resultados/ 2>/dev/null || true
          mkdir -p /tmp/r && cp -r resultados/. /tmp/r/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeros-${{ matrix.e }}
          path: resultados/
          retention-days: 30
      - name: grava já na branch resultados-alturas
        if: always()
        run: python3 computations/grava_resultados.py resultados-alturas /tmp/r --run ${{ github.run_id }} --sha ${{ github.sha }} --titulo "alturas (zeros 1e${{ matrix.e }})"
  contagem:
    needs: zeros
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        e: ${{ fromJSON(github.event.inputs.alturas || '["18"]') }}
        lado: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zeros-${{ matrix.e }}
          path: zeros-${{ matrix.e }}
      - name: FLINT 3 (com o Arb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libflint-dev
      - name: compila
        run: gcc -O2 -o zeros computations/alturas/zeros.c -lflint -lmpfr -lgmp -lm
      - name: N(T_${{ matrix.lado }}) em 10^${{ matrix.e }}
        run: python3 computations/alturas/alturas.py contagem ./zeros resultados 20000 ${{ matrix.e }} ${{ matrix.lado }} zeros-${{ matrix.e }} 2>&1 | tee log-contagem-${{ matrix.e }}-${{ matrix.lado }}.txt
      - name: estado como anotação
        if: always()
        run: |
          cat resultados/contagem_1e${{ matrix.e }}_${{ matrix.lado }}.json 2>/dev/null | tr '\n' ' ' | sed -E 's/%/%25/g; s/^/::warning title=alturas-contagem-${{ matrix.e }}-${{ matrix.lado }}::/' || true
      - name: guarda
        if: always()
        run: |
          mkdir -p resultados && cp log-contagem-*.txt resultados/ 2>/dev/null || true
          mkdir -p /tmp/r && cp -r resultados/. /tmp/r/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contagem-${{ matrix.e }}-${{ matrix.lado }}
          path: resultados/
          retention-days: 30
      - name: grava já na branch resultados-alturas
        if: always()
        run: python3 computations/grava_resultados.py resultados-alturas /tmp/r --run ${{ github.run_id }} --sha ${{ github.sha }} --titulo "alturas (contagem 1e${{ matrix.e }} ${{ matrix.lado }})"
  junta:
    needs: [zeros, contagem]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: tarefas
      - name: o que já estava na branch
        run: |
          git fetch -q origin resultados-alturas:refs/remotes/origin/resultados-alturas || true
          git show origin/resultados-alturas:alturas.json > existente.json 2>/dev/null || true
      - name: fecha e junta
        run: python3 computations/alturas/junta.py tarefas resultados existente.json 2>&1 | tee junta.log
      - name: estado como anotação
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('resultados/alturas.json'));print(json.dumps([{k:v for k,v in j.items() if k not in ('estatistica','blocos','falhas','tentativas')} for j in d['janelas']],ensure_ascii=False))" 2>/dev/null | sed -E 's/%/%25/g; s/^/::warning title=alturas::/' || true
      - name: grava na branch resultados-alturas
        if: always()
        run: |
          mkdir -p resultados && cp junta.log resultados/ 2>/dev/null || true
          mkdir -p /tmp/r && cp -r resultados/. /tmp/r/ 2>/dev/null || true
          python3 computations/grava_resultados.py resultados-alturas /tmp/r --run ${{ github.run_id }} --sha ${{ github.sha }} --titulo "alturas"
